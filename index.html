<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitaxus | Instagram Content Planner</title>
  <link rel="icon" href="./logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Montserrat"', 'system-ui', 'sans-serif'],
          },
          colors: {
            bitaxus: {
              bg: '#09090a',
              panel: '#111113',
              panel2: '#18181b',
              panel3: '#202024',
              line: '#232327',
              line2: '#2e2e33',
              red: '#c1121f',
              redHover: '#d61a28',
              redLight: '#ff4d57',
              redSoft: 'rgba(193, 18, 31, 0.16)',
              text: '#f1f1f3',
              muted: '#8b8b94'
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: #09090a;
      --panel: #111113;
      --panel-2: #18181b;
      --panel-3: #202024;
      --line: #232327;
      --line-2: #2e2e33;
      --text: #f1f1f3;
      --muted: #8b8b94;
      --red: #c1121f;
      --red-2: #ff4d57;
    }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background:
        radial-gradient(rgba(255,255,255,0.06) 1.2px, transparent 1.2px) 0 0 / 28px 28px,
        radial-gradient(60% 45% at 15% 5%, rgba(193, 18, 31, 0.28), transparent 70%),
        radial-gradient(55% 40% at 95% 95%, rgba(193, 18, 31, 0.20), transparent 75%),
        #09090a;
      color: #f1f1f3;
      min-height: 100vh;
    }
    /* Barras de desplazamiento oscuras y finas estilo Bitaxus */
    * { scrollbar-width: thin; scrollbar-color: #34343a transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c2c31; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #3d3d44; background-clip: padding-box; }
  </style>
</head>
<body class="min-h-screen text-slate-100 selection:bg-[#c1121f] selection:text-white">
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
